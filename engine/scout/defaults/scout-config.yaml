schema_version: 1

user:
  email: ""
  github_username: ""
  slack_user_id: ""
  timezone: America/New_York
  company: ""
  display_name: ""

# The four knobs `scoutctl budget check` enforces before every scheduled run.
# These MUST equal BudgetConfig()'s defaults in scout/scripts/budget_check.py —
# tests/unit/test_budget_defaults_parity.py fails the build if they drift.
# Override them per-vault with `scoutctl budget set`, not by editing this file.
budget:
  daily_usd: 50
  window_hours: 5
  skip_at_pct: 80
  failure_backoff_minutes: 60

thresholds:
  rate_limit_warn_pct: 80
  rate_limit_block_pct: 95
  connector_staleness_hours: 24

features:
  tui: true
  connector_health: true
  dreaming: true

auto_update:
  enabled: false
  channel: stable

# Day planning for /scout-plan. MUST equal PlanningSettings()'s defaults in
# scout/planning/settings.py; tests/unit/test_planning_settings.py fails the
# build if they drift. Times are quoted: YAML 1.1 reads a bare 09:00 as a
# base-60 integer.
planning:
  work_start: "09:00"
  work_end: "17:00"
  increment_minutes: 15
  capacity_pct: 65
  buffer: 1.25
  new_work_buffer: 1.5
  deep_block_minutes: 90
  batch_block_minutes: 45
  meeting_gap_minutes: 15
  calibration_min_samples: 5
  calibration_window: 20
  calibration_min_factor: 0.75
  calibration_max_factor: 2.5
  event_title_prefix: "[Scout]"
  event_visibility: private
  event_availability: busy

# Agent-session index (scoutctl session index). Spec: scout-app
# docs/superpowers/specs/2026-09-08-agent-sessions-design.md §4.11.
# NOTE: `sessions:` is the budget block in older vaults — this is a separate key.
agent_sessions:
  stale_after_days: 3
  running_window_seconds: 120
  pr_refresh_minutes: 10
  pr_fetch_cap: 25
  transcript_window_days: 14
  done_visible_hours: 24
  render_max_per_bucket: 15
  use_gh: true
  desktop_support_dir: null
  claude_home: null
