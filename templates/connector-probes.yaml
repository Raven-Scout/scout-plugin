# Declarative probe registry for /scout-setup connector detection.
# When MCP namespaces shift, update this file (no wizard prose changes needed).

slack:
  primary: mcp__plugin_slack_slack__slack_read_user_profile
  fallbacks:
    - mcp__claude_ai_Slack__slack_read_user_profile
  needs_user_input:
    - user_slack_id
calendar:
  primary: mcp__claude_ai_Google_Calendar__list_calendars
  fallbacks: []
# Provider-neutral mail key — must match `requires: email` in phases/connectors/email.md.
# Gmail is the current (only) provider; legacy configs saying `gmail` are
# normalized to `email` by scout.scripts.connector_probes.normalize_connector_keys.
email:
  primary: mcp__claude_ai_Gmail__list_labels
  fallbacks: []
linear:
  primary: mcp__plugin_linear_linear__list_teams
  fallbacks: []
github:
  primary: bash
  command: "gh auth status"
  needs_user_input:
    - github_username
    - github_repos
granola:
  primary: mcp__claude_ai_Granola__list_meetings
  fallbacks: []
fathom:
  primary: mcp__fathom__list_meetings
  fallbacks: []
drive:
  primary: mcp__claude_ai_Google_Drive__list_recent_files
  fallbacks: []
claude_sessions:
  primary: bash
  command: "test -d ~/.claude/projects"
# Telegram is the one connector detected by a local secret rather than an MCP
# namespace or a CLI login: the bot token IS the credential, and its presence is
# exactly the condition under which both directions work. Probing the Bot API
# instead would turn setup into a network call that fails for reasons unrelated
# to whether the operator has configured anything.
#
# Registered so a vault can enable it — without a probe entry the key cannot be
# selected by /scout-setup, and `phases/modes/feedback-processing.md` gates on it
# via `requires: any-of(slack, notify:telegram)`.
notify:telegram:
  primary: bash
  command: "test -r ~/.scout-secrets/telegram-bot-token"
