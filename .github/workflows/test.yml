name: test

on:
  push:
    branches: [main, "migrate/**"]
  pull_request:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Setup Python
        run: uv python install ${{ matrix.python }}
      - name: Create venv
        run: uv venv --python ${{ matrix.python }}
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Pytest
        run: .venv/bin/pytest tests/ -v
      - name: Verify connectors.snapshot.json drift
        # The canonical snapshot lives at engine/scout/connectors.snapshot.json
        # (Plan 4 Task 8). scout-app's bundled fixture is a synced copy. CI
        # here checks the canonical file is in sync with the YAML — drift =
        # someone edited connectors.yaml and forgot to regenerate.
        run: .venv/bin/python -m scout.scripts.connectors_snapshot --check --target scout/connectors.snapshot.json
      - name: Verify schedule.snapshot.json drift
        # The canonical snapshot lives at engine/scout/schedule.snapshot.json
        # (Plan 5 Task 8). scout-app's bundled fixture is a synced copy. CI
        # here checks the canonical file is in sync with the YAML — drift =
        # someone edited schedule.yaml and forgot to regenerate.
        run: .venv/bin/python -m scout.scripts.schedule_snapshot --check --target scout/schedule.snapshot.json

  # Coverage runs once, not across the matrix, for two reasons:
  #   1. The `[full]` extra is required. Every scout/tui test is gated on
  #      `pytest.importorskip("textual")`, so a `[dev]`-only install skips the
  #      whole TUI package and the total drops ~3 points below the gate.
  #   2. Coverage's tracer skews tests/perf/, which measures scoutctl's cold
  #      -start latency. Keeping the matrix job coverage-free leaves those
  #      timings honest.
  # The threshold itself lives in [tool.coverage.report] fail_under.
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Setup Python
        run: uv python install 3.12
      - name: Create venv
        run: uv venv --python 3.12
      - name: Install
        run: uv pip install -e ".[dev,full]"
      - name: Pytest with coverage
        run: .venv/bin/pytest tests/ --cov --cov-report=term-missing
